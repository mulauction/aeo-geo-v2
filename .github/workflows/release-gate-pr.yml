name: release-gate

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: release-gate / smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke
        run: bash scripts/smoke.sh

