<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AEO/GEO v2 - 최근 리포트</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
      margin: 0;
      padding: 24px;
      background: #fff;
      font-size: 14px;
      line-height: 1.45;
      color: #111827;
    }
    .app {
      max-width: 960px;
      margin: 0 auto;
      background: #fff;
      padding: 32px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .home-link {
      margin-bottom: 24px;
      display: inline-block;
      color: #111827;
      text-decoration: none;
    }
    .home-link:hover {
      text-decoration: underline;
    }
    h1 {
      margin: 0 0 24px 0;
      font-size: 24px;
      font-weight: 700;
      color: #111827;
    }
    .empty-state {
      padding: 18px;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      background: #fff;
      text-align: center;
    }
    .empty-state-title {
      font-size: 13px;
      color: #111827;
      font-weight: 600;
      margin: 0 0 8px 0;
    }
    .empty-state-desc {
      font-size: 12px;
      color: #6B7280;
      line-height: 1.4;
      margin: 0 0 16px 0;
    }
    .cta-btn {
      height: 34px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      background: #111827;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      transition: background-color 140ms, border-color 140ms, box-shadow 140ms;
    }
    .cta-btn:hover {
      background: #0B1220;
      border-color: #D1D5DB;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .cta-btn:focus,
    .cta-btn:focus-visible {
      outline: 1px solid rgba(17, 24, 39, 0.35);
      outline-offset: 2px;
      box-shadow: none !important;
    }
    .recent-list {
      display: flex;
      flex-direction: column;
    }
    .recent-item {
      position: relative;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      justify-content: space-between;
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      background: #fff;
      transition: border-color 140ms, box-shadow 140ms;
    }
    .recent-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      border-radius: 12px 0 0 12px;
      background: #E5E7EB;
    }
    .recent-item.status-good::before { background: #10B981; }
    .recent-item.status-mid::before { background: #F59E0B; }
    .recent-item.status-low::before { background: #E5E7EB; }
    .recent-item:last-child { margin-bottom: 0; }
    .recent-item:hover {
      border-color: #D1D5DB;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .recent-item:active {
      box-shadow: none;
    }
    .recent-item:active {
      box-shadow: none;
    }
    .recent-item-info {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .active-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #4B5563;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.2;
      background: transparent;
      border: 0;
      padding: 0;
      border-radius: 0;
    }
    .active-indicator::before {
      content: '';
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: #10B981;
      display: inline-block;
      flex-shrink: 0;
    }
    .recent-title {
      font-size: 15px;
      font-weight: 600;
      color: #111827;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
      max-height: calc(1.3em * 2);
      word-break: break-word;
    }
    .recent-meta {
      font-size: 12px;
      color: #6B7280;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .recent-item-id {
      font-family: monospace;
      font-size: 11px;
      color: #9CA3AF;
    }
    .status-line {
      font-size: 12px;
      margin-top: 2px;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .status-line-incomplete {
      color: #9CA3AF;
    }
    .status-line-partial {
      color: #2563EB;
    }
    .status-line-complete {
      color: #111827;
    }
    .recent-time-hint {
      font-size: 11px;
      color: #9CA3AF;
    }
    .score-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      border: 1px solid;
    }
    .score-badge-good {
      background: #ECFDF5;
      color: #065F46;
      border-color: #D1FAE5;
    }
    .score-badge-mid {
      background: #FFFBEB;
      color: #92400E;
      border-color: #FDE68A;
    }
    .score-badge-low {
      background: #F3F4F6;
      color: #374151;
      border-color: #E5E7EB;
    }
    .open-btn {
      height: 34px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      background: #111827;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    .open-btn:hover { background: #0B1220; }
    .open-btn:focus,
    .open-btn:focus-visible {
      outline: 1px solid rgba(17, 24, 39, 0.35);
      outline-offset: 2px;
      box-shadow: none !important;
    }
    .open-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="app">
    <a href="./home.html" class="home-link">Home</a>
    <h1>최근 리포트</h1>
    <div id="recentListContainer"></div>
  </div>

  <script type="module">
    (function() {
      const RECENT_KEY = '__recentReportsV1';
      
      function parseJsonSafe(str, fallback) {
        try {
          return JSON.parse(str);
        } catch {
          return fallback;
        }
      }
      
      function loadRecentReports() {
        try {
          const raw = localStorage.getItem(RECENT_KEY);
          const arr = parseJsonSafe(raw || '[]', []);
          return Array.isArray(arr) ? arr : [];
        } catch {
          return [];
        }
      }
      
      function formatDate(dateStr) {
        if (!dateStr) return '';
        try {
          const date = new Date(dateStr);
          return date.toLocaleString('ko-KR', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });
        } catch {
          return dateStr;
        }
      }
      
      function esc(str) {
        if (str === null || str === undefined) return '';
        const s = String(str);
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }
      
      function getRelativeTime(dateStr) {
        if (!dateStr) return '';
        try {
          const date = new Date(dateStr);
          const now = new Date();
          const diffMs = now.getTime() - date.getTime();
          const diffMins = Math.floor(diffMs / 60000);
          const diffHours = Math.floor(diffMs / 3600000);
          const diffDays = Math.floor(diffMs / 86400000);
          
          if (diffMins < 1) return '방금';
          if (diffMins < 60) return '방금';
          if (diffDays === 0) return '오늘';
          if (diffDays === 1) return '1일 전';
          if (diffDays <= 3) return `${diffDays}일 전`;
          return '';
        } catch {
          return '';
        }
      }
      
      function renderList() {
        const container = document.getElementById('recentListContainer');
        if (!container) return;
        
        const items = loadRecentReports();
        const urlParams = new URLSearchParams(window.location.search);
        const debug = urlParams.get('debug') === '1';
        
        // (선택) fallback: __lastV2가 있으면 최근 1건만이라도 보여줄 수 있음
        let fallbackItem = null;
        if (items.length === 0) {
          try {
            const lastV2Str = localStorage.getItem('__lastV2');
            if (lastV2Str) {
              const lastV2 = parseJsonSafe(lastV2Str, null);
              if (lastV2 && typeof lastV2 === 'object') {
                const reportId = lastV2.reportId || lastV2.meta?.reportId || lastV2.meta?.id || lastV2.id || null;
                const target = lastV2.input ? (() => {
                  const tempDiv = document.createElement('div');
                  tempDiv.innerHTML = lastV2.input;
                  const text = tempDiv.textContent || tempDiv.innerText || '';
                  return text.trim().substring(0, 80) || '분석 대상 없음';
                })() : '분석 대상 없음';
                const generatedAt = lastV2.generatedAt || null;
                
                if (reportId && /^\d+$/.test(String(reportId))) {
                  fallbackItem = {
                    reportId: String(reportId),
                    target: target,
                    createdAt: generatedAt,
                    generatedAt: generatedAt
                  };
                }
              }
            }
          } catch (_) {}
        }
        
        const hasRecent = Array.isArray(items) && items.length > 0;
        
        if (!hasRecent) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-title">최근분석이 없습니다</div>
              <div class="empty-state-desc">상품 URL을 분석하면 리포트가 여기에 저장됩니다.</div>
              <button class="cta-btn" id="goAnalyzeBtn" type="button">분석하러 가기</button>
            </div>
          `;
          document.getElementById('goAnalyzeBtn')?.addEventListener('click', () => {
            location.href = './analyze.html';
          });
          return;
        }
        
        const allItems = fallbackItem ? [fallbackItem, ...items] : items;
        
        // 정렬: createdAt 또는 generatedAt 기준 내림차순
        const sortedItems = [...allItems].sort((a, b) => {
          const aKey = (a && typeof a === 'object') ? (a.createdAt ?? a.generatedAt ?? null) : null;
          const bKey = (b && typeof b === 'object') ? (b.createdAt ?? b.generatedAt ?? null) : null;
          if (aKey == null && bKey == null) return 0;
          if (aKey == null) return 1;
          if (bKey == null) return -1;
          return new Date(bKey).getTime() - new Date(aKey).getTime();
        });
        
        // 현재 열람중 reportId 확인
        const currentReportId = (() => {
          try {
            return String(localStorage.getItem('__currentReportId') || '');
          } catch {
            return '';
          }
        })();
        
        const html = sortedItems.map((it, idx) => {
          if (!it || typeof it !== 'object') return '';
          
          const target = it.target || '분석 대상 없음';
          const reportId = it.reportId || it.id || it.r || null;
          const reportIdStr = reportId != null ? String(reportId) : '';
          const hasNumericId = /^\d+$/.test(reportIdStr);
          const whenKey = it.createdAt ?? it.generatedAt ?? null;
          const when = formatDate(whenKey);
          const score = typeof it.score === 'number' && Number.isFinite(it.score) ? it.score : null;
          
          // Score grade 결정
          let scoreGrade = null;
          let scoreBadgeClass = '';
          let statusClass = '';
          if (score !== null) {
            if (score >= 80) {
              scoreGrade = '좋음';
              scoreBadgeClass = 'score-badge-good';
              statusClass = 'status-good';
            } else if (score >= 50) {
              scoreGrade = '보통';
              scoreBadgeClass = 'score-badge-mid';
              statusClass = 'status-mid';
            } else {
              scoreGrade = '낮음';
              scoreBadgeClass = 'score-badge-low';
              statusClass = 'status-low';
            }
          }
          
          // KPI 값 추출 (v2 데이터에서)
          const v2 = it.v2 || it.entry?.v2 || null;
          const brandingScore = v2?.analysis?.scores?.branding ?? null;
          const contentStructure = v2?.analysis?.contentStructureV2 ?? null;
          const urlStructure = v2?.analysis?.urlStructureV1 ?? null;
          
          // 측정 상태 판단 및 항목 수집
          const hasBranding = brandingScore !== null && brandingScore !== undefined;
          const hasStructure = contentStructure !== null && contentStructure !== undefined;
          const hasUrl = urlStructure !== null && urlStructure !== undefined;
          const measuredCount = [hasBranding, hasStructure, hasUrl].filter(Boolean).length;
          
          let statusText = null;
          let statusLineClass = '';
          
          if (measuredCount === 0) {
            // 측정 미완료
            statusText = '측정 미완료 · 브랜딩/구조/URL';
            statusLineClass = 'status-line-incomplete';
          } else if (measuredCount < 3) {
            // 부분 완료
            const measuredItems = [];
            if (hasBranding) measuredItems.push('브랜딩');
            if (hasStructure) measuredItems.push('구조');
            if (hasUrl) measuredItems.push('URL');
            statusText = `부분 완료 · ${measuredItems.join('/')}`;
            statusLineClass = 'status-line-partial';
          } else {
            // 완료
            statusText = '완료 · 브랜딩/구조/URL';
            statusLineClass = 'status-line-complete';
          }
          
          // 상대 시간 힌트
          const relativeTime = getRelativeTime(whenKey);
          
          const isActive = Boolean(currentReportId) && String(reportIdStr) === String(currentReportId);
          const showRecentBadge = (idx === 0);
          
          return `
            <div class="recent-item ${statusClass}">
              <div class="recent-item-info">
                <div class="card-header">
                  ${showRecentBadge ? '<span class="active-indicator">최근분석</span>' : ''}
                </div>
                <div class="recent-title">${esc(target)}</div>
                <div class="recent-meta">
                  ${when ? `<span>${esc(when)}${relativeTime ? ` <span class="recent-time-hint">· ${esc(relativeTime)}</span>` : ''}</span>` : ''}
                  ${reportIdStr ? `<span class="recent-item-id">ID: ${esc(reportIdStr)}</span>` : ''}
                </div>
                ${statusText ? `<div class="status-line ${statusLineClass}">${esc(statusText)}</div>` : ''}
              </div>
              <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
                ${scoreGrade ? `<span class="score-badge ${scoreBadgeClass}">${esc(scoreGrade)}</span>` : ''}
                <button type="button" class="open-btn" data-report-id="${esc(reportIdStr)}" ${!hasNumericId ? 'disabled' : ''}>열기</button>
              </div>
            </div>
          `;
        }).join('');
        
        container.innerHTML = `<div class="recent-list">${html}</div>`;
        
        // ✅ [Hotfix] [열기] 버튼 클릭 핸들러: v2를 __lastV2에 주입 후 share.html로 이동
        container.querySelectorAll('.open-btn[data-report-id]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const reportIdStr = btn.getAttribute('data-report-id');
            if (!reportIdStr || !/^\d+$/.test(reportIdStr)) {
              alert('이 리포트 데이터가 이 기기에 없습니다. Analyze에서 다시 실행 후 열어주세요.');
              return;
            }
            
            try {
              // localStorage.__recentReportsV1에서 해당 reportId의 entry 찾기
              const items = loadRecentReports();
              const hit = items.find((x) => {
                if (!x || typeof x !== 'object') return false;
                const entryId = String(x.reportId || x.id || x.r || '');
                return entryId === reportIdStr;
              });
              
              // fallback: __lastV2에서 찾기 (fallbackItem인 경우)
              let v2 = null;
              if (hit && typeof hit === 'object') {
                v2 = hit.v2 || hit.entry?.v2 || null;
              }
              
              if (!v2 || typeof v2 !== 'object') {
                // fallback: __lastV2에서 직접 찾기
                try {
                  const lastV2Str = localStorage.getItem('__lastV2');
                  if (lastV2Str) {
                    const lastV2 = parseJsonSafe(lastV2Str, null);
                    if (lastV2 && typeof lastV2 === 'object') {
                      const lastV2Id = String(lastV2.reportId || lastV2.meta?.reportId || lastV2.meta?.id || lastV2.id || '');
                      if (lastV2Id === reportIdStr) {
                        v2 = lastV2;
                      }
                    }
                  }
                } catch (_) {}
              }
              
              if (!v2 || typeof v2 !== 'object') {
                alert('이 리포트 데이터가 이 기기에 없습니다. Analyze에서 다시 실행 후 열어주세요.');
                return;
              }
              
              // v2를 __lastV2에 주입
              try {
                localStorage.setItem('__lastV2', JSON.stringify(v2));
                localStorage.setItem('__currentReportId', String(reportIdStr));
                
                const urlParams = new URLSearchParams(window.location.search);
                const isDebug = urlParams.get('debug') === '1';
                const debugParam = isDebug ? '&debug=1' : '';
                const targetUrl = `./share.html?restore=1&r=${encodeURIComponent(reportIdStr)}${debugParam}`;
                
                if (isDebug) {
                  console.info('[share-list][open]', { reportId: reportIdStr, injected: true });
                }
                
                location.href = targetUrl;
              } catch (e) {
                console.warn('[share-list] Failed to inject __lastV2:', e);
                alert('리포트 데이터 저장에 실패했습니다. 다시 시도해주세요.');
              }
            } catch (e) {
              console.warn('[share-list] Failed to open report:', e);
              alert('리포트를 열 수 없습니다. 다시 시도해주세요.');
            }
          });
        });
      }
      
      // 페이지 로드 시 렌더링
      renderList();
    })();
  </script>
</body>
</html>
