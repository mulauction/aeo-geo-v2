<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AEO/GEO v2 - 최근 리포트</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f5f5;
    }
    .app {
      max-width: 960px;
      margin: 0 auto;
      background: #fff;
      padding: 32px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .home-link {
      margin-bottom: 24px;
      display: inline-block;
      color: #0066cc;
      text-decoration: none;
    }
    .home-link:hover {
      text-decoration: underline;
    }
    h1 {
      margin: 0 0 24px 0;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
    }
    .empty-state {
      padding: 48px 24px;
      text-align: center;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }
    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .recent-item {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: #fff;
    }
    .recent-item-info {
      min-width: 0;
      flex: 1;
    }
    .recent-item-target {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 4px;
    }
    .recent-item-meta {
      font-size: 12px;
      color: #666;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .recent-item-id {
      font-family: monospace;
      font-size: 11px;
      color: #888;
    }
    .btn-open {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      background: #0066cc;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      white-space: nowrap;
    }
    .btn-open:hover {
      background: #0052a3;
    }
    .btn-open:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="app">
    <a href="./home.html" class="home-link">Home</a>
    <h1>최근 리포트</h1>
    <div id="recentListContainer"></div>
  </div>

  <script type="module">
    (function() {
      const RECENT_KEY = '__recentReportsV1';
      
      function parseJsonSafe(str, fallback) {
        try {
          return JSON.parse(str);
        } catch {
          return fallback;
        }
      }
      
      function loadRecentReports() {
        try {
          const raw = localStorage.getItem(RECENT_KEY);
          const arr = parseJsonSafe(raw || '[]', []);
          return Array.isArray(arr) ? arr : [];
        } catch {
          return [];
        }
      }
      
      function formatDate(dateStr) {
        if (!dateStr) return '';
        try {
          const date = new Date(dateStr);
          return date.toLocaleString('ko-KR', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });
        } catch {
          return dateStr;
        }
      }
      
      function esc(str) {
        if (str === null || str === undefined) return '';
        const s = String(str);
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }
      
      function renderList() {
        const container = document.getElementById('recentListContainer');
        if (!container) return;
        
        const items = loadRecentReports();
        const urlParams = new URLSearchParams(window.location.search);
        const debug = urlParams.get('debug') === '1';
        
        // (선택) fallback: __lastV2가 있으면 최근 1건만이라도 보여줄 수 있음
        let fallbackItem = null;
        if (items.length === 0) {
          try {
            const lastV2Str = localStorage.getItem('__lastV2');
            if (lastV2Str) {
              const lastV2 = parseJsonSafe(lastV2Str, null);
              if (lastV2 && typeof lastV2 === 'object') {
                const reportId = lastV2.reportId || lastV2.meta?.reportId || lastV2.meta?.id || lastV2.id || null;
                const target = lastV2.input ? (() => {
                  const tempDiv = document.createElement('div');
                  tempDiv.innerHTML = lastV2.input;
                  const text = tempDiv.textContent || tempDiv.innerText || '';
                  return text.trim().substring(0, 80) || '분석 대상 없음';
                })() : '분석 대상 없음';
                const generatedAt = lastV2.generatedAt || null;
                
                if (reportId && /^\d+$/.test(String(reportId))) {
                  fallbackItem = {
                    reportId: String(reportId),
                    target: target,
                    createdAt: generatedAt,
                    generatedAt: generatedAt
                  };
                }
              }
            }
          } catch (_) {}
        }
        
        const allItems = fallbackItem ? [fallbackItem] : items;
        
        if (allItems.length === 0) {
          container.innerHTML = '<div class="empty-state">최근 리포트가 없습니다. Analyze에서 실행 후 다시 열어주세요.</div>';
          return;
        }
        
        // 정렬: createdAt 또는 generatedAt 기준 내림차순
        const sortedItems = [...allItems].sort((a, b) => {
          const aKey = (a && typeof a === 'object') ? (a.createdAt ?? a.generatedAt ?? null) : null;
          const bKey = (b && typeof b === 'object') ? (b.createdAt ?? b.generatedAt ?? null) : null;
          if (aKey == null && bKey == null) return 0;
          if (aKey == null) return 1;
          if (bKey == null) return -1;
          return new Date(bKey).getTime() - new Date(aKey).getTime();
        });
        
        const html = sortedItems.map((it) => {
          if (!it || typeof it !== 'object') return '';
          
          const target = it.target || '분석 대상 없음';
          const reportId = it.reportId || it.id || it.r || null;
          const reportIdStr = reportId != null ? String(reportId) : '';
          const hasNumericId = /^\d+$/.test(reportIdStr);
          const whenKey = it.createdAt ?? it.generatedAt ?? null;
          const when = formatDate(whenKey);
          const score = (typeof it.score === 'number') ? `${it.score}점` : '';
          
          return `
            <div class="recent-item">
              <div class="recent-item-info">
                <div class="recent-item-target">${esc(target)}</div>
                <div class="recent-item-meta">
                  ${when ? `<span>${esc(when)}</span>` : ''}
                  ${score ? `<span>· ${esc(score)}</span>` : ''}
                  ${reportIdStr ? `<span class="recent-item-id">ID: ${esc(reportIdStr)}</span>` : ''}
                </div>
              </div>
              <button type="button" class="btn-open" data-report-id="${esc(reportIdStr)}" ${!hasNumericId ? 'disabled' : ''}>열기</button>
            </div>
          `;
        }).join('');
        
        container.innerHTML = `<div class="recent-list">${html}</div>`;
        
        // ✅ [Hotfix] [열기] 버튼 클릭 핸들러: v2를 __lastV2에 주입 후 share.html로 이동
        container.querySelectorAll('.btn-open[data-report-id]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const reportIdStr = btn.getAttribute('data-report-id');
            if (!reportIdStr || !/^\d+$/.test(reportIdStr)) {
              alert('이 리포트 데이터가 이 기기에 없습니다. Analyze에서 다시 실행 후 열어주세요.');
              return;
            }
            
            try {
              // localStorage.__recentReportsV1에서 해당 reportId의 entry 찾기
              const items = loadRecentReports();
              const hit = items.find((x) => {
                if (!x || typeof x !== 'object') return false;
                const entryId = String(x.reportId || x.id || x.r || '');
                return entryId === reportIdStr;
              });
              
              // fallback: __lastV2에서 찾기 (fallbackItem인 경우)
              let v2 = null;
              if (hit && typeof hit === 'object') {
                v2 = hit.v2 || hit.entry?.v2 || null;
              }
              
              if (!v2 || typeof v2 !== 'object') {
                // fallback: __lastV2에서 직접 찾기
                try {
                  const lastV2Str = localStorage.getItem('__lastV2');
                  if (lastV2Str) {
                    const lastV2 = parseJsonSafe(lastV2Str, null);
                    if (lastV2 && typeof lastV2 === 'object') {
                      const lastV2Id = String(lastV2.reportId || lastV2.meta?.reportId || lastV2.meta?.id || lastV2.id || '');
                      if (lastV2Id === reportIdStr) {
                        v2 = lastV2;
                      }
                    }
                  }
                } catch (_) {}
              }
              
              if (!v2 || typeof v2 !== 'object') {
                alert('이 리포트 데이터가 이 기기에 없습니다. Analyze에서 다시 실행 후 열어주세요.');
                return;
              }
              
              // v2를 __lastV2에 주입
              try {
                localStorage.setItem('__lastV2', JSON.stringify(v2));
                localStorage.setItem('__currentReportId', String(reportIdStr));
                
                const urlParams = new URLSearchParams(window.location.search);
                const isDebug = urlParams.get('debug') === '1';
                const debugParam = isDebug ? '&debug=1' : '';
                const targetUrl = `./share.html?restore=1&r=${encodeURIComponent(reportIdStr)}${debugParam}`;
                
                if (isDebug) {
                  console.info('[share-list][open]', { reportId: reportIdStr, injected: true });
                }
                
                location.href = targetUrl;
              } catch (e) {
                console.warn('[share-list] Failed to inject __lastV2:', e);
                alert('리포트 데이터 저장에 실패했습니다. 다시 시도해주세요.');
              }
            } catch (e) {
              console.warn('[share-list] Failed to open report:', e);
              alert('리포트를 열 수 없습니다. 다시 시도해주세요.');
            }
          });
        });
      }
      
      // 페이지 로드 시 렌더링
      renderList();
    })();
  </script>
</body>
</html>
