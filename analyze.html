<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AEO/GEO v2 - Analyze</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./core/styles/a11y.css">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
      margin: 0;
      padding: 24px;
    }
    .app {
      max-width: 960px;
      margin: 0 auto;
    }
    .home-link {
      margin-bottom: 24px;
      display: inline-block;
    }
    h1 {
      margin: 0 0 24px 0;
    }
    .input-group {
      margin-bottom: 16px;
    }
    #inputText {
      width: 100%;
    }
    #btnAnalyze {
      padding: 10px 20px;
    }
    #status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 14px;
    }
    #result {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 14px;
    }
    #modalOverlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1000;
    }
    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 24px;
      z-index: 1001;
      max-width: 400px;
      width: 90%;
    }
    .modal h3 {
      margin: 0 0 16px 0;
    }
    .modal p {
      margin: 0 0 16px 0;
    }
    .modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    #btnAiImprove[data-loading="1"] {
      opacity: 0.85;
    }
    #btnAiImprove[data-loading="1"]::after {
      content: " (AI 생성중...)";
    }
  </style>
</head>
<body>
  <div class="app">
    <a href="./home.html" class="home-link">Home</a>
    
    <div id="header"></div>

    <!-- ✅ [Phase 1-A] Usage/Plan header (UI-only; no deduction logic) -->
    <div id="usagePlanHeader" style="margin: 12px 0 16px 0;"></div>
    
    <h1>Analyze - 콘텐츠 관찰 및 점수 계산</h1>
    <p style="margin: 6px 0 10px 0; color: var(--muted); font-size: 12px;">
      이전 리포트를 기준으로 다시 분석합니다.
    </p>
    <p style="margin: 0 0 24px 0; color: var(--muted); font-size: 14px;">
      Analyze는 콘텐츠를 관찰하고 점수를 계산합니다. 생성된 콘텐츠는 점수에 영향을 주지 않습니다.
    </p>
    
    <div class="input-group">
      <input type="text" id="inputText" class="input" />
    </div>
    
    <button id="btnAnalyze" class="btn btn-primary">Analyze</button>
    <a id="btnViewShareReport" class="btn btn-dark" href="./share.html?restore=1" style="margin-left: 12px;">리포트 공유 보기</a>
    <p style="margin: 6px 0 0 0; font-size: 12px; color: var(--muted);">
      결과가 생성되면 1회가 사용됩니다.
    </p>

    <!-- ✅ [Phase 1-A] Channel auto-convert (UI-only; visible but gated by plan) -->
    <div id="channelAutoConvert" style="margin-top: 12px; padding: 12px 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border);">
      <div style="display:flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
        <div style="font-size: 13px; font-weight: 600; color: var(--text);">채널 자동 변환</div>
        <div style="font-size: 12px; color: var(--muted);">UI-only</div>
      </div>
      <div style="height: 10px;"></div>
      <div style="display:flex; gap: 8px; flex-wrap: wrap;">
        <button type="button" class="btn btn-dark" data-channel-auto="1">스마트스토어</button>
        <button type="button" class="btn btn-dark" data-channel-auto="1">쿠팡</button>
        <button type="button" class="btn btn-dark" data-channel-auto="1">블로그</button>
      </div>
      <div id="channelAutoConvertHint" style="margin-top: 6px; font-size: 12px; color: var(--muted);"></div>
    </div>
    
    <div id="status"></div>
    <div id="result"></div>
  </div>

  <div id="modalOverlay"></div>
  
  <div id="loginModal" class="modal">
    <h3>로그인 필요</h3>
    <p id="modalReason" style="display: none;"></p>
    <div class="modal-buttons">
      <button id="btnModalClose" class="btn-secondary">취소</button>
      <button id="btnModalLogin" class="btn-primary">로그인</button>
    </div>
  </div>

  <div id="creditModal" class="modal">
    <h3>크레딧 부족</h3>
    <p>필요 크레딧: <strong id="creditModalCost"></strong></p>
    <p id="creditModalReason" style="display: none;"></p>
    <div class="modal-buttons">
      <button id="btnCreditModalClose" class="btn-secondary">확인</button>
    </div>
  </div>

  <script type="module">
    import { boot } from './core/lifecycle.js';
    import { getSessionId, hashId, track } from './core/telemetry.js';
    
    // ✅ [Phase 90-4][dev-only] debug=1 persistence across navigation (localhost only; UI/logic unchanged)
    (function () {
      try {
        const isDev = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || String(location.origin || '').includes('localhost'));
        if (!isDev) return;
        const p = new URLSearchParams(location.search || '');
        if (p.get('debug') === '1') {
          try { sessionStorage.setItem('__aeoDebug', '1'); } catch (_) {}
        }
        const shouldCarry = (() => { try { return sessionStorage.getItem('__aeoDebug') === '1'; } catch (_) { return false; } })();
        if (!shouldCarry) return;
        if (p.get('debug') === '1') return;
        try {
          p.set('debug', '1');
          const next = location.pathname + '?' + p.toString() + (location.hash || '');
          history.replaceState(null, '', next);
        } catch (_) {}
      } catch (_) {}
    })();

    // ✅ [Phase 100-UI] Analyze: "리포트 공유 보기" navigation (UI-only; no storage/schema changes)
    (function () {
      try {
        const el = document.getElementById('btnViewShareReport');
        if (!el) return;
        const p = new URLSearchParams(location.search || '');
        const hasDebug = p.get('debug') === '1';
        el.setAttribute('href', `./share.html?restore=1${hasDebug ? '&debug=1' : ''}`);
      } catch (_) {}
    })();

    // ✅ [Phase 90-1C][observe-only] UX telemetry: analyze_view (no UX change; run after DOMContentLoaded)
    (function () {
      const runOnce = () => {
        try {
          const sid = (typeof getSessionId === 'function') ? getSessionId() : '';
          const onceKey = '__telemetry_once_analyze_view_' + String(sid || '');
          if (typeof sessionStorage !== 'undefined' && sid && sessionStorage.getItem(onceKey) === '1') return;
          try { if (typeof sessionStorage !== 'undefined' && sid) sessionStorage.setItem(onceKey, '1'); } catch (_) {}
          const ref = String(document.referrer || '');
          const from = ref.includes('share.html') ? 'share' : (ref.includes('home.html') ? 'home' : 'direct');
          let has_previous_report = false;
          try {
            const v = localStorage.getItem('__lastV2');
            has_previous_report = !!(v && v.length > 10);
          } catch (_) {}
          track('analyze_view', { from, has_previous_report: !!has_previous_report });
        } catch (_) {}
      };
      try {
        if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', runOnce, { once: true });
        else runOnce();
      } catch (_) {
        try { runOnce(); } catch (_) {}
      }
    })();

    // ✅ [observe-only] UX telemetry: analyze_action_run (no UX change)
    (function () {
      try {
        const bind = () => {
          try {
            const btn = document.getElementById('btnAnalyze');
            if (!btn) return;
            if (btn.__telemetryBoundAnalyzeRun) return;
            btn.__telemetryBoundAnalyzeRun = true;
            btn.addEventListener('click', () => {
              try {
                const rawId = String(localStorage.getItem('__currentReportId') || '');
                const report_id = (typeof hashId === 'function') ? hashId(rawId) : '';
                track('analyze_action_run', { report_id });
              } catch (_) {}
            }, true);
          } catch (_) {}
        };
        if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', bind, { once: true });
        else bind();
      } catch (_) {}
    })();

    boot();
  </script>
</body>
</html>
